version: '3.8'

services:
  shivtravels-app:
    build: .
    container_name: shivtravels_app
    restart: always
    ports:
      - "8181:8181"
      - "80:8181"
    environment:
      - PORT=8181
      - DB_HOST=shivtravels-db
      - DB_PORT=3306
      - DB_NAME=voyagehub_db
      - DB_USER=root
      - DB_PASSWORD=shivtravels_secret
    depends_on:
      - shivtravels-db

  shivtravels-db:
    image: mysql:8.0
    container_name: shivtravels_mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=shivtravels_secret
      - MYSQL_DATABASE=voyagehub_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/setup_database.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data:
