# =====================================================================
# SHIV TRAVELS - MySQL Database Configuration (db.properties)
# =====================================================================
# Configure your local MySQL 8.0 server parameters below.
# Default Host: localhost
# Default Port: 3306
# Database Name: voyagehub_db
# =====================================================================

db.host=localhost
db.port=3306
db.name=voyagehub_db
db.user=root
db.password=

# Set to true to automatically synchronize DataStore with MySQL when online
db.autoSync=true

# Set to false if you want to force in-memory mode only
db.enabled=true
